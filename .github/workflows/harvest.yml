name: harvest-keywords

on:
  schedule:
    - cron: '0 20 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-write
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: harvest related keywords
        env:
          NAVER_API_KEY: ${{ secrets.NAVER_API_KEY }}
          NAVER_SECRET: ${{ secrets.NAVER_SECRET }}
          NAVER_CUSTOMER: ${{ secrets.NAVER_CUSTOMER }}
        run: python3 scripts/harvest.py

      - name: commit
        run: |
          git config user.name 'harvest-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add keywords_pool.json pool_history.json
          git diff --cached --quiet && { echo 'no change'; exit 0; }
          git commit -m 'harvest keywords pool [bot]'
          git pull --rebase --autostash || true
          git push
